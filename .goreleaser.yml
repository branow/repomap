version: 2

project_name: repomap

# Every artifact is a CGO_ENABLED=0 build, darwin included: the macOS keychain
# backend (gokey) still calls the Security framework, but loads it at run time
# rather than linking it, so each stored secret is still bound to the binary that
# stored it. Linux and Windows use the platform's own credential store. The
# darwin builds still need a macOS runner, for codesign alone.
builds:
  - id: unix
    main: .
    binary: repomap
    env:
      - CGO_ENABLED=0
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: macos
    main: .
    binary: repomap
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [amd64, arm64]
    # Signed with the release certificate; see scripts/sign.sh for what it does
    # and does not keep across upgrades. codesign needs macOS, so the release
    # runs on a macOS runner.
    hooks:
      post:
        - cmd: ./scripts/sign.sh "{{ .Path }}"
          output: true
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

universal_binaries:
  - ids: [macos]
    replace: true

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: repomap
    repository:
      owner: branow
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/branow/repomap
    description: Index a set of repositories into a compact map an agent can read in one pass
    # Quarantine is stripped only while the release is signed but not yet
    # notarized. Once notarization is in place this block goes: a notarized
    # binary passes Gatekeeper on its own, and stripping quarantine by hand is
    # exactly the habit a user should not be taught.
    custom_block: |
      postflight_steps do
        if_path_exists "/usr/bin/xattr" do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/repomap"]
        end
      end

nfpms:
  - package_name: repomap
    ids: [unix]
    formats: [deb, rpm, apk]
    maintainer: Orest Bodnar <branow.code@gmail.com>
    homepage: https://github.com/branow/repomap
    description: Index a set of repositories into a compact map an agent can read in one pass
    license: MIT
    bindir: /usr/bin

scoops:
  - name: repomap
    repository:
      owner: branow
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://github.com/branow/repomap
    description: Index a set of repositories into a compact map an agent can read in one pass
    license: MIT

changelog:
  use: git
