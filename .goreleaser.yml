version: 2

project_name: repomap

# macOS builds are cgo builds: the keychain backend calls the Security framework
# directly so that each stored secret is bound to the binary that stored it.
# That means darwin artifacts must be built on a macOS runner, one per arch —
# a cgo build cannot cross-compile or emit both from one invocation. Linux and
# Windows have no such requirement and stay on CGO_ENABLED=0, where the keychain
# falls back to the platform's own credential store.
builds:
  - id: unix
    main: .
    binary: repomap
    env:
      - CGO_ENABLED=0
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: macos
    main: .
    binary: repomap
    env:
      - CGO_ENABLED=1
    goos: [darwin]
    goarch: [amd64, arm64]
    # Signed, not ad-hoc. The keychain binds each stored secret to the code
    # identity of the binary that stored it, and an ad-hoc signature has no
    # certificate to anchor to - so the identity is the cdhash, which changes
    # with every build. Users would re-authorize every token on every upgrade.
    hooks:
      post:
        - cmd: ./scripts/sign.sh "{{ .Path }}"
          output: true
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

universal_binaries:
  - ids: [macos]
    replace: true

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: repomap
    repository:
      owner: branow
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/branow/repomap
    description: Index a set of repositories into a compact map an agent can read in one pass
    # Quarantine is stripped only while the release is signed but not yet
    # notarized. Once notarization is in place this block goes: a notarized
    # binary passes Gatekeeper on its own, and stripping quarantine by hand is
    # exactly the habit a user should not be taught.
    custom_block: |
      postflight_steps do
        if_path_exists "/usr/bin/xattr" do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/repomap"]
        end
      end

nfpms:
  - package_name: repomap
    ids: [unix]
    formats: [deb, rpm, apk]
    maintainer: Orest Bodnar <branow.code@gmail.com>
    homepage: https://github.com/branow/repomap
    description: Index a set of repositories into a compact map an agent can read in one pass
    license: MIT
    bindir: /usr/bin

scoops:
  - name: repomap
    repository:
      owner: branow
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://github.com/branow/repomap
    description: Index a set of repositories into a compact map an agent can read in one pass
    license: MIT

changelog:
  use: git
